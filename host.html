<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThumX Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fff; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .header-title { font-size: 0.85rem; font-weight: 600; color: #444; letter-spacing: 0.5px; }
    .badge { font-size: 0.75rem; color: #999; background: #f5f5f5; padding: 2px 8px; border-radius: 20px; }
    .card { border: 1px solid #ececec; border-radius: 10px; overflow: hidden; cursor: pointer; background: #fff; max-width: 400px; transition: transform 0.15s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
    .card img { width: 100%; display: block; }
    .card-info { padding: 10px 12px 12px; }
    .card-date { font-size: 0.75rem; color: #aaa; }
    .watch-text { margin-top: 6px; font-size: 0.88rem; font-weight: 700; color: #e63946; letter-spacing: 0.3px; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 10px; object-fit: contain; }
    .lightbox-close { position: absolute; top: 14px; right: 18px; font-size: 1.8rem; color: #fff; cursor: pointer; }
    .status { text-align: center; color: #bbb; padding: 32px 0; font-size: 0.85rem; }
    .footer { text-align: center; margin-top: 14px; font-size: 0.68rem; color: #ccc; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-title">HOSTINGER GALLERY</span>
    <span class="badge">Latest thumbnail</span>
  </div>
  <div id="content"><p class="status">Loading...</p></div>
  <div class="footer">© <span id="year"></span> ThumX &nbsp;·&nbsp; Updates instantly</div>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>
  <script>
    var REPO = 'neetud252-create/thumbnail-gallery';

    document.getElementById('year').textContent = new Date().getFullYear();

    function load() {
      var t       = Date.now();
      var IMG_URL = 'https://raw.githubusercontent.com/' + REPO + '/main/images/latest-host.jpg?t=' + t;
      var content = document.getElementById('content');

      var img = new Image();
      img.onload = function() {
        var date = new Date().toLocaleString('en-IN', {
          day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: true,
          timeZone: 'Asia/Kolkata'
        });
        content.innerHTML =
          '<div class="card" onclick="openLightbox()">' +
            '<img src="' + IMG_URL + '" alt="Thumbnail">' +
            '<div class="card-info">' +
              '<div class="card-date">' + date + '</div>' +
              '<div class="watch-text">▶ Watch for 2 Minute</div>' +
            '</div>' +
          '</div>';
        document.getElementById('lightbox-img').src = IMG_URL;
      };
      img.onerror = function() {
        content.innerHTML = '<p class="status">No thumbnail published yet.</p>';
      };
      img.src = IMG_URL;
    }

    function openLightbox() { document.getElementById('lightbox').classList.add('open'); }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
