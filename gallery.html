<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThumX Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fff; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .header-title { font-size: 0.85rem; font-weight: 600; color: #444; letter-spacing: 0.5px; }
    .badge { font-size: 0.75rem; color: #999; background: #f5f5f5; padding: 2px 8px; border-radius: 20px; }
    .card { border: 1px solid #ececec; border-radius: 10px; overflow: hidden; cursor: pointer; background: #fff; max-width: 400px; }
    .card img { width: 100%; display: block; }
    .card-info { padding: 10px 12px 12px; }
    .card-date { font-size: 0.75rem; color: #aaa; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 10px; object-fit: contain; }
    .lightbox-close { position: absolute; top: 14px; right: 18px; font-size: 1.8rem; color: #fff; cursor: pointer; }
    .footer { text-align: center; margin-top: 14px; font-size: 0.68rem; color: #ccc; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-title">GALLERY</span>
    <span class="badge">Latest thumbnail</span>
  </div>

  <div id="content">
    <div class="card" onclick="openLightbox()">
      <img id="thumb" src="" alt="Latest thumbnail">
      <div class="card-info">
        <div class="card-date" id="date">Loading...</div>
      </div>
    </div>
  </div>

  <div class="footer">© <span id="year"></span> ThumX · Updates instantly</div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Your Cloudinary cloud name
    const CLOUD = 'dvgpkwko2';
    const THUMB_URL = `https://res.cloudinary.com/${CLOUD}/image/upload/w_1280,h_720,c_fill,f_auto,q_100/thumbnails/latest-thumbnail?t=${Date.now()}`;
    const FULL_URL  = `https://res.cloudinary.com/${CLOUD}/image/upload/f_auto,q_auto/thumbnails/latest-thumbnail?t=${Date.now()}`;

    document.getElementById('thumb').src = THUMB_URL;
    document.getElementById('lightbox-img').src = FULL_URL;
    document.getElementById('date').textContent = new Date().toLocaleString('en-IN', {
      day: 'numeric', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true,
      timeZone: 'Asia/Kolkata'
    });

    function openLightbox() {
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
  </script>
</body>
</html>
